  {"m":"2026年05月（下）","cat":"2.★★【文件】【修订后的《中国共产党发展党员工作细则》】","html":"文件规定，发展对象未来<span class='blank-space'><span class='ans-span answer-hidden'>三个月</span></span>内将离开工作、学习单位的，一般不办理接收预备党员的手续。\n经基层党委预审合格的发展对象，应当在一个月内提交党支部党员大会讨论。\n召开讨论接收预备党员的党支部党员大会，实际到会有表决权的党员人数必须超过应到会有表决权的党员人数的<span class='blank-space'><span class='ans-span answer-hidden'>半数</span></span>。赞成人数超过应到会有表决权的党员人数的<span class='blank-space'><span class='ans-span answer-hidden'>半数</span></span>，才能通过接收预备党员的决议。\n党支部党员大会讨论<span class='blank-space'><span class='ans-span answer-hidden'>两个</span></span>以上的发展对象入党时，必须逐个讨论和表决。","ans":"三个月、半数、半数、两个"},
  {"m":"2026年05月（下）","cat":"2.★★【文件】【修订后的《中国共产党发展党员工作细则》】","html":"文件规定，预备党员必须由党委审批。<span class='blank-space'><span class='ans-span answer-hidden'>乡镇（街道）</span></span>党委所属的基层党委，不能审批预备党员，但应当对党支部党员大会通过接收的预备党员进行审议。\n党总支不能审批预备党员，但应当对党支部党员大会通过接收的预备党员进行<span class='blank-space'><span class='ans-span answer-hidden'>审议</span></span>。\n除另有规定外，临时党组织不能<span class='blank-space'><span class='ans-span answer-hidden'>接收、审批</span></span>预备党员。党组不能审批预备党员，但应当按照党章和有关规定讨论和决定<span class='blank-space'><span class='ans-span answer-hidden'>发展党员</span></span>重要事项。","ans":"乡镇（街道）、审议、接收、审批、发展党员"},
  {"m":"2026年05月（下）","cat":"2.★★【文件】【修订后的《中国共产党发展党员工作细则》】","html":"文件规定，预备党员的预备期为<span class='blank-space'><span class='ans-span answer-hidden'>一年</span></span>。\n预备期从党支部党员大会通过其为预备党员之日算起。预备党员预备期满，党支部应当及时讨论其能否转为正式党员。认真履行党员义务、具备党员条件的，应当按期转为正式党员；\n需要继续考察和教育的，可以延长一次预备期，延长时间不能少于<span class='blank-space'><span class='ans-span answer-hidden'>半年</span></span>，最长不超过<span class='blank-space'><span class='ans-span answer-hidden'>一年</span></span>；不履行党员义务、不具备党员条件的，应当取消其预备党员资格。\n预备党员转为正式党员、延长预备期或者取消预备党员资格，应当经党支部<span class='blank-space'><span class='ans-span answer-hidden'>党员大会</span></span>讨论通过和上级党组织批准。","ans":"一年、半年、一年、党员大会"},

  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"1.加强随迁子女教育保障。\n学龄人口流入多的城市政府做好存量学位资源挖潜和整合利用，按需新增学位，巩固提升义务教育阶段随迁子女就读<span class='blank-space'><span class='ans-span answer-hidden'>公办学位</span></span>比例。\n对暂时无法保障义务教育阶段公办学位的随迁子女，<span class='blank-space'><span class='ans-span answer-hidden'>常住地</span></span>政府切实落实购买学位责任，减轻随迁子女家庭的教育支出负担。\n随迁子女在义务教育阶段因常住地变化或父母工作调动等需要转学的，常住地政府按规定予以保障。\n着力提高随迁子女就读公办初中比例，九年一贯制学校校内直升政策对随迁子女、当地户籍学生<span class='blank-space'><span class='ans-span answer-hidden'>同等</span></span>对待。\n落实学生资助政策，确保对家庭经济困难随迁子女应助尽助。推动将随迁子女纳入常住地学前教育、高中阶段教育公共服务范围。落实符合条件的随迁子女在常住地参加升学考试政策。","ans":"公办学位、常住地、同等"},
  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"2.扩大公租房保障范围。推动更多城市将稳定就业居住的<span class='blank-space'><span class='ans-span answer-hidden'>未落户</span></span>常住人口家庭纳入公租房保障范围，推行按<span class='blank-space'><span class='ans-span answer-hidden'>就业居住</span></span>年限、住房困难程度确定保障对象、保障方式、保障标准、准入条件和退出机制。\n采取实物保障、<span class='blank-space'><span class='ans-span answer-hidden'>货币补贴</span></span>等多种方式，在合理轮候期内对符合条件的未落户常住人口家庭予以保障。加强公租房与保障性租赁住房政策衔接。","ans":"未落户、就业居住、货币补贴"},
  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"3.健全就业地参加职工社会保险制度。<span class='blank-space'><span class='ans-span answer-hidden'>全面取消</span></span>在就业地参加职工社会保险的户籍限制，大力推进全民参保计划，引导支持各类劳动者在就业地参加职工社会保险。\n健全农民工、灵活就业人员、新就业形态人员参加社会保险制度，完善社保关系转移接续政策，研究促进灵活就业人员参加职工<span class='blank-space'><span class='ans-span answer-hidden'>基本养老保险</span></span>的政策措施，将新就业形态人员职业伤害保障试点范围扩大到更多地方和平台企业。\n持续推进工程建设领域农民工按<span class='blank-space'><span class='ans-span answer-hidden'>项目</span></span>参加工伤保险。\n完善企业职工基本养老保险<span class='blank-space'><span class='ans-span answer-hidden'>全国</span></span>统筹，稳妥推进基本医疗保险<span class='blank-space'><span class='ans-span answer-hidden'>省级</span></span>统筹，巩固工伤保险、失业保险省级统筹成效。","ans":"全面取消、基本养老保险、项目、全国、省级"},
  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"4.加强常住地基本医疗保障。加力落实持居住证参加城乡居民基本医疗保险政策，超大特大城市等各类城市切实保障外地户籍中小学生、学龄前儿童等在常住地参加城乡居民基本医疗保险的权利，各地对持居住证参保人员按照户籍人口<span class='blank-space'><span class='ans-span answer-hidden'>相同</span></span>标准给予财政补助，巩固扩大参保覆盖面。\n加强异地就医直接结算管理服务，提升异地就医备案管理和结算报销可及性、便利性。各地<span class='blank-space'><span class='ans-span answer-hidden'>不得</span></span>将办理职工医保退休人员待遇与在当地按月领取基本养老金绑定。","ans":"相同、不得"},

  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"6.完善兜底性基本公共服务。完善临时救助政策，对遭遇突发性、紧迫性、灾难性困难，生活陷入困境的人员，取消户籍地、居住地申请限制，在<span class='blank-space'><span class='ans-span answer-hidden'>急难发生地</span></span>按规定给予临时救助。","ans":"急难发生地"},

  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"1.开展常住人口总量、结构、流动趋势和公共服务需求预测，按<span class='blank-space'><span class='ans-span answer-hidden'>常住人口</span></span>和服务半径完善公共服务设施空间布局，优化建设运行资金分配、人力资源配置，加强人口流入城市和县城的公共服务能力。","ans":"常住人口"},
  {"m":"2026年05月（下）","cat":"3.★★【文件】【《关于推行常住地提供基本公共服务的实施意见》】","html":"2.对供需矛盾突出的基本公共服务，各地可通过<span class='blank-space'><span class='ans-span answer-hidden'>积分制</span></span>等方式，在一定时期内采取以就业、居住等时间因素为主要条件的梯度供给办法，促进基本公共服务资源公平有序分配，逐步<span class='blank-space'><span class='ans-span answer-hidden'>减少</span></span>梯度层次和差异、降低享有门槛。切实落实基本公共服务保基本、兜底线的定位，区分梯度供给与人才引进措施，<span class='blank-space'><span class='ans-span answer-hidden'>不得</span></span>设置学历、职称、纳税贡献等限制条件。","ans":"积分制、减少、不得"},

  {"m":"2026年05月（下）","cat":"4.★★【文件】【《城市更新“十五五”规划》】","html":"1.坚持系统观念，坚持规划引领，坚持统筹发展和安全，坚持<span class='blank-space'><span class='ans-span answer-hidden'>保护</span></span>第一、应保尽保、<span class='blank-space'><span class='ans-span answer-hidden'>以用促保</span></span>，因地制宜、分类指导，尽力而为、量力而行，建立可持续的城市更新体制机制和政策法规，高质量推进城市更新，为建设现代化人民城市提供坚实基础。","ans":"保护、以用促保"},
  {"m":"2026年05月（下）","cat":"4.★★【文件】【《城市更新“十五五”规划》】","html":"2.到<span class='blank-space'><span class='ans-span answer-hidden'>2030</span></span>年，城市更新行动取得重要进展，城市开发建设方式转型初见成效，安全发展基础更加牢固，服务效能不断提高，人居环境明显改善，新旧动能加快转换，文化遗产有效保护，风貌特色更加彰显，治理水平大幅提高，城市成为人民群众高品质生活的空间。\n到2035年，城市更新体制机制更加完善，城市结构优化、动能转换、品质提升、绿色转型、文脉赓续、治理增效取得显著成效，创新、宜居、美丽、韧性、文明、智慧的现代化人民城市<span class='blank-space'><span class='ans-span answer-hidden'>基本建成</span></span>。","ans":"2030、基本建成"},
  {"m":"2026年05月（下）","cat":"4.★★【文件】【《城市更新“十五五”规划》】","html":"3.要培育壮大城市发展新动能。\n推进超大特大城市治理现代化，以<span class='blank-space'><span class='ans-span answer-hidden'>城市群</span></span>、都市圈为依托构建大中小城市协调发展格局。\n推动消费基础设施改造升级，发展首发经济、银发经济、冰雪经济、低空经济、赛事经济、体验经济等。\n优化<span class='blank-space'><span class='ans-span answer-hidden'>保障性</span></span>住房供给，强化城镇低收入住房困难家庭住房保障，更好满足住房困难且收入不高的工薪群体基本住房需求，逐步解决新市民、青年等群体的阶段性住房困难。因城施策增加<span class='blank-space'><span class='ans-span answer-hidden'>改善性</span></span>住房供给，规范发展住房租赁市场。","ans":"城市群、保障性、改善性"},
  {"m":"2026年05月（下）","cat":"4.★★【文件】【《城市更新“十五五”规划》】","html":"4.要营造高品质城市生活空间。\n实施房屋品质提升工程，兼顾增量建设与存量更新，全链条提升住房标准、设计、材料、建造、运维水平，建设改造安全舒适绿色智慧的“好房子”。\n鼓励居民开展既有住房装修和局部升级改造，推广装配式装修和适老化、无障碍改造，应用性能优异的新型建材。\n优化住房产品设计，完善户型功能，<span class='blank-space'><span class='ans-span answer-hidden'>调高</span></span>层高，提高隔声性能，提升装配式装修应用比例。\n重点对建成<span class='blank-space'><span class='ans-span answer-hidden'>20</span></span>年及以上的城镇住宅小区开展专项体检，聚焦补齐基础设施短板、提升服务功能和环境品质实施针对性改造。\n结合实际合理确定改造对象范围，优先改造市政配套设施存在安全隐患、居民改造意愿强烈的小区。鼓励以<span class='blank-space'><span class='ans-span answer-hidden'>市场化</span></span>方式推动老旧厂区改造提升。","ans":"调高、20、市场化"},

  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第一，增强科技创新体系化攻关能力。要坚持“<span class='blank-space'><span class='ans-span answer-hidden'>四个</span></span>面向”战略导向，进一步加强科技战略规划、政策措施、重大任务、科研力量、资源平台、区域创新等方面统筹，提高科技攻关组织化程度，提升国家创新体系整体效能。","ans":"四个"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"（1）在科研任务推进上，重点要完善国家重大科技创新任务部署和组织实施机制，聚焦人工智能、量子科技、生命科学等前沿领域，集成电路、先进制造等重点领域，深海、深空、深地等战略领域，一体部署重大工程和重大项目，统筹推进原始创新和关键核心技术攻关。\n在科技力量建设上，重点要优化国家战略科技力量功能定位和布局，推动任务协同、资源共享、优势互补，使其更好担当国家战略使命、产出更多重大战略成果。\n要支持国家战略科技力量与其他科技力量合作攻关，统筹配置科研任务、平台基地、关键人才，形成覆盖基础研究、应用开发、成果转化的体系化攻关格局。","ans":""},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"（2）在科技创新联动上，重点要加强对各层级科技工作的统筹指导，形成央地协同、区域联动的制度安排，统筹建设国际科技创新中心和区域科技创新中心，强化区域协同创新。\n各地区情况不同，要因地制宜探索创新发展路径，确立<span class='blank-space'><span class='ans-span answer-hidden'>比较</span></span>优势，打造特色创新高地，不能盲目跟风追热点，搞“<span class='blank-space'><span class='ans-span answer-hidden'>内卷</span></span>式”竞争、<span class='blank-space'><span class='ans-span answer-hidden'>同质</span></span>化发展。","ans":"比较、内卷、同质"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第二，推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。\n要突出科技创新<span class='blank-space'><span class='ans-span answer-hidden'>供给</span></span>和产业<span class='blank-space'><span class='ans-span answer-hidden'>需求</span></span>牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。\n<span class='blank-space'><span class='ans-span answer-hidden'>科技</span></span>创新要突出应用导向，支持高校、科研院所对接企业开展科研攻关和人才培养，以高质量科技供给赋能产业创新。\n<span class='blank-space'><span class='ans-span answer-hidden'>产业</span></span>创新要提出科学问题，强化<span class='blank-space'><span class='ans-span answer-hidden'>企业</span></span>创新主体地位，支持企业与高校、科研院所共建平台、共克难题，以高端化、绿色化、智能化产业需求牵引科技创新。","ans":"供给、需求、科技、产业、企业"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"科技成果转化率不高，一直是我们面临的一个突出问题。要加强国家技术转移体系建设，布局建立一批概念验证中心和中试平台，破解制约早期科技成果转化的瓶颈。\n要完善知识产权保护制度，打破高校、科研院所、企业之间创新要素的流动壁垒。要构建同科技创新相适应的科技金融体制，推动创业投资市场健康稳定发展，畅通企业投融资渠道，引导金融资本投早、投小、投长期、投硬科技。","ans":""},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第三，<span class='blank-space'><span class='ans-span answer-hidden'>大力</span></span>培养优秀青年科技人才。要把青年科技人才队伍建设作为一项战略工程，全方位做好培养、引进、使用工作。","ans":"大力"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"一体推进教育科技人才发展，是我们在实践中摸索总结的成功经验。\n要优化科教<span class='blank-space'><span class='ans-span answer-hidden'>协同</span></span>育人机制，坚持在培养中使用、在使用中培养，注重在科研一线发现和培养更多优秀青年科技人才。\n加大对科研人员职业<span class='blank-space'><span class='ans-span answer-hidden'>早</span></span>期和<span class='blank-space'><span class='ans-span answer-hidden'>长周期</span></span>稳定支持力度，完善科技奖励、收入分配等制度，帮助解决实际困难，让他们潜心钻研、安身安心安业。\n要抓住全球人才流动窗口期，积极引进海外优秀青年人才和团队。要注重挖掘和培养青少年兴趣特长、科学素养、实验能力，吸引更多具有科研潜质的青少年立志投身科技事业。","ans":"协同、早、长"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第四，提高科技创新投入效能。“十四五”时期，我国全社会研发经费投入保持年均<span class='blank-space'><span class='ans-span answer-hidden'>10</span></span>%的增长，投入强度 2025 年达到 2.8%、首次超过<span class='blank-space'><span class='ans-span answer-hidden'>经合组织</span></span>国家平均水平。\n各级各有关方面要完善制度机制，改进管理办法，确保真金白银既投到位、更用得好，实现投入规模<span class='blank-space'><span class='ans-span answer-hidden'>增加</span></span>与效能提升的统一。","ans":"10%、经合组织、增加"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"财政经费在科技投入中具有风向标作用。\n要完善中央财政科技经费分配和管理使用机制，重点向战略性、关键性领域倾斜；健全重大科技任务央地投入共担机制，合理配置中央和地方财政资金，引导地方聚焦<span class='blank-space'><span class='ans-span answer-hidden'>国家</span></span>战略需求加大研发投入。\n要引导<span class='blank-space'><span class='ans-span answer-hidden'>企业</span></span>增加研发投入，调动更多社会力量支持科技创新。","ans":"国家、企业"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第五，用好科技评价指挥棒。\n科技评价重在按科研规律办事。\n项目评审、机构评估、人才评价都要强化创新能力、质量、实效、贡献导向，体现不同类别的<span class='blank-space'><span class='ans-span answer-hidden'>差异</span></span>性，不能评价指标权重模糊甚至本末倒置，不能搞“一刀切”、“一锅煮”。\n要持续深化科教界“帽子”治理，防止简单以称号头衔确定薪酬待遇、配置创新资源。\n要大力弘扬科学家精神，加强科研诚信建设，以更严标准、更实举措整治作风学风突出问题，严肃惩处学术不端行为，营造风清气正的科研生态。","ans":"差异"},
  {"m":"2026年07月（上）","cat":"4.★★【学习】【在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话】","html":"第六，加强科技伦理和安全治理。\n加强科技伦理和安全治理，重点在于完善政策制度、法律法规和治理规范，健全多方参与、协同共治的体制机制。\n要针对人工智能、生命科学等重点领域，明确伦理标准和指引，有效应对规则冲突和伦理挑战。\n要加强科技安全风险研判、监测预警和应急响应，统筹高技术研发和高水平安全，提高关键部位和设施安全防护能力。\n要深度<span class='blank-space'><span class='ans-span answer-hidden'>参与</span></span>全球科技治理，广泛宣介中国主张和中国方案，提升国际规则制定话语权和影响力。","ans":"参与"},

  {"m":"2026年08月（上）","cat":"1.★★【学习】【2026年第15期《求是》杂志发表习近平重要文章《加快建设健康中国》】","html":"第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域差距<span class='blank-space'><span class='ans-span answer-hidden'>仍然较大</span></span>的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的<span class='blank-space'><span class='ans-span answer-hidden'>公益</span></span>性，走中国特色卫生与健康发展道路。\n在2016年的全国卫生与健康大会上，中共中央明确提出新时代卫生与健康工作方针，即以<span class='blank-space'><span class='ans-span answer-hidden'>基层</span></span>为重点，以<span class='blank-space'><span class='ans-span answer-hidden'>改革创新</span></span>为动力，<span class='blank-space'><span class='ans-span answer-hidden'>预防为主</span></span>，中西医并重，把健康融入所有政策，人民共建共享。\n当前和今后一个时期，我国卫生与健康工作需要因应形势发展变化，优化完善一些具体政策举措，但是走中国特色卫生与健康发展道路不能动摇，贯彻新时代卫生与健康工作方针不能动摇。","ans":"仍然较大、生命、健康优先、公益、基层、改革创新、预防"},
  {"m":"2026年08月（上）","cat":"1.★★【学习】【2026年第15期《求是》杂志发表习近平重要文章《加快建设健康中国》】","html":"第二，突出重点推进健康中国建设。\n健康中国建设是一项系统工程。\n面对人民群众日益增长的多元化卫生健康需求，我们要紧紧抓住那些惠及面广、牵一发而动全身、对整个卫生与健康事业有重大影响的工作，集中力量和资源推动，不断取得新的成效。\n比如，健全公共卫生体系，要求深化社会共治、医防协同、医防融合，强化传染病预防控制、监测预警、医疗救治、应急处置、物资保障和监督管理。\n要高度重视心理健康和精神卫生问题，加强<span class='blank-space'><span class='ans-span answer-hidden'>预防</span></span>引导、早期发现和综合干预。\n再比如，人们对建设优质高效医疗服务体系的期望很高，要继续优化体系布局，实施医疗卫生强基工程，促进<span class='blank-space'><span class='ans-span answer-hidden'>分级</span></span>诊疗，加强县区和基层医疗卫生机构运行保障。\n要推进中西医结合，针对重点人群和薄弱专科加快补齐医疗服务短板，提高慢性病综合防控水平，扩大康复护理和安宁疗护等服务供给。","ans":"预防、分级"},
  {"m":"2026年08月（上）","cat":"1.★★【学习】【2026年第15期《求是》杂志发表习近平重要文章《加快建设健康中国》】","html":"第三，为健康中国建设提供有力保障。\n要健全党委统一领导、党政齐抓共管的工作格局，完善健康促进政策制度体系，将健康理念融入公共政策制定实施的全过程。\n要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材<span class='blank-space'><span class='ans-span answer-hidden'>集中</span></span>采购政策，提高医保资金使用效率，完善医疗、医保、医药<span class='blank-space'><span class='ans-span answer-hidden'>协同</span></span>发展和治理机制。\n要推动科技创新成果在卫生健康领域转化运用，推进全民健康数智化建设。\n要加强卫生健康行业的党建工作，调动广大医务人员的积极性主动性创造性，加大人才培养力度，弘扬优良医德医风，着力营造风清气正的行业环境。","ans":"集中、协同"},

let currentScope = 'all'; // 'all', 'module', or category name

// 初始化首页 14 个月份模块的网格按钮
function initMonthGrid() {
  const container = document.getElementById('month-menu-grid');
  container.innerHTML = '';
  modulesConfig.forEach(mod => {
    const btn = document.createElement('button');
    btn.className = 'btn-cat btn-month';
    btn.textContent = mod.name;
    btn.onclick = () => openModule(mod);
    container.appendChild(btn);
  });
}
initMonthGrid();

// 点击进入某个月份二级界面
function openModule(mod) {
  currentModule = mod;
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('module-screen').classList.remove('hidden');
  document.getElementById('module-title').textContent = mod.name;

  const articleGrid = document.getElementById('article-list-grid');
  articleGrid.innerHTML = '';

  mod.articles.forEach(artTitle => {
    const btn = document.createElement('button');
    btn.className = 'btn-cat';
    btn.style.textAlign = 'left';
    btn.style.whiteSpace = 'normal';
    btn.textContent = artTitle;
    btn.onclick = () => startArticleQuiz(artTitle);
    articleGrid.appendChild(btn);
  });
}

// 返回首页主目录
function showHomeScreen() {
  if (timerHandle) clearInterval(timerHandle);
  startedAt = 0;
  document.getElementById('module-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
}

// 背诵页面“退出”逻辑：若处于月份下则返回该月份文章列表，否则返回主目录
function exitToPrevious() {
  if (timerHandle) clearInterval(timerHandle);
  if (currentModule) {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('module-screen').classList.remove('hidden');
  } else {
    showHomeScreen();
  }
}

// 启动：全部 14 个模块所有内容总连背
function startQuizAll() {
  currentModule = null;
  currentScope = 'all';
  activeQuestions = questionDatabase.slice();
  launchGame();
}

// 启动：当前月份所有文章连背
function startModuleAll() {
  if (!currentModule) return;
  currentScope = 'module_' + currentModule.name;
  activeQuestions = questionDatabase.filter(q => q.m === currentModule.name);
  launchGame();
}

// 启动：单篇文章背诵
function startArticleQuiz(artTitle) {
  currentScope = artTitle;
  activeQuestions = questionDatabase.filter(q => q.cat === artTitle);
  launchGame();
}

// 进入答题主界面并初始化计时器与下拉框
function launchGame() {
  currentIndex = 0;
  answersVisible = false;
  startedAt = Date.now();

  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('module-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  if (timerHandle) clearInterval(timerHandle);
  updateTimer();
  timerHandle = setInterval(updateTimer, 1000);

  updateCategoryDropdown();
  renderQuestion();
}

function updateTimer() {
  if (!startedAt) return;
  const s = Math.floor((Date.now() - startedAt) / 1000);
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  document.getElementById('timer').textContent = m + ':' + sec;
}

// 刷新顶部分类/文章下拉选择框
function updateCategoryDropdown() {
  const catSelect = document.getElementById('categorySelect');
  catSelect.innerHTML = '';

  // 1. 全局与本月整期快捷选项
  const optAll = document.createElement('option');
  optAll.value = '__ALL__';
  optAll.textContent = '🌟 全库所有内容（04月—10月全部）';
  catSelect.appendChild(optAll);

  if (currentModule) {
    const optMod = document.createElement('option');
    optMod.value = '__MODULE__' + currentModule.name;
    optMod.textContent = `📁 【本月全部】${currentModule.name}`;
    catSelect.appendChild(optMod);
  }

  // 2. 按 14 个月份列出分组和文章
  modulesConfig.forEach(mod => {
    const group = document.createElement('optgroup');
    group.label = `--- ${mod.name} ---`;
    mod.articles.forEach(art => {
      const opt = document.createElement('option');
      opt.value = art;
      opt.textContent = art.length > 38 ? art.substring(0, 36) + '...' : art;
      group.appendChild(opt);
    });
    catSelect.appendChild(group);
  });

  // 设置当前下拉框选中的项
  if (currentScope === 'all') {
    catSelect.value = '__ALL__';
  } else if (currentScope.startsWith('module_')) {
    catSelect.value = '__MODULE__' + currentModule.name;
  } else {
    catSelect.value = currentScope;
  }
}

// 刷新段落跳转下拉菜单
function updateJumpDropdown() {
  const jumpSelect = document.getElementById('jumpSelect');
  jumpSelect.innerHTML = '';
  activeQuestions.forEach((_, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `跳转：第 ${idx + 1} 段 / 共 ${activeQuestions.length} 段`;
    if (idx === currentIndex) opt.selected = true;
    jumpSelect.appendChild(opt);
  });
}

// 响应顶部文章/模块下拉框切换
function onCategorySelectChange(val) {
  if (val === '__ALL__') {
    startQuizAll();
  } else if (val.startsWith('__MODULE__')) {
    const modName = val.replace('__MODULE__', '');
    currentModule = modulesConfig.find(m => m.name === modName);
    startModuleAll();
  } else {
    // 切换到具体文章
    const parentMod = modulesConfig.find(m => m.articles.includes(val));
    if (parentMod) currentModule = parentMod;
    startArticleQuiz(val);
  }
}

// 响应段落跳转下拉框
function onJumpSelectChange(val) {
  currentIndex = parseInt(val, 10);
  answersVisible = false;
  renderQuestion();
}

// 渲染当前题目/段落
function renderQuestion() {
  if (!activeQuestions.length) return finishQuiz();
  const q = activeQuestions[currentIndex];

  document.getElementById('question').innerHTML = q.html;
  document.getElementById('position').textContent = `第 ${currentIndex + 1} / ${activeQuestions.length} 段`;
  document.getElementById('categoryTag').textContent = q.cat;
  document.getElementById('progress').style.width = ((currentIndex + 1) / activeQuestions.length * 100) + '%';
  document.getElementById('answers').textContent = answersVisible ? q.ans : '';

  // 更新挖空高亮显示/隐藏状态
  document.querySelectorAll('#question .ans-span').forEach(e => {
    e.classList.toggle('answer-show', answersVisible);
    e.classList.toggle('answer-hidden', !answersVisible);
  });

  // 保证跳转下拉框同步当前段落
  updateJumpDropdown();
}

function revealAnswer() {
  answersVisible = !answersVisible;
  renderQuestion();
}

function toggleAllAnswers() {
  revealAnswer();
}

function nextStep() {
  if (currentIndex < activeQuestions.length - 1) {
    currentIndex++;
    answersVisible = false;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevStep() {
  if (currentIndex > 0) {
    currentIndex--;
    answersVisible = false;
    renderQuestion();
  }
}

function finishQuiz() {
  if (timerHandle) clearInterval(timerHandle);
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('res-count').textContent = activeQuestions.length + ' 段';
  document.getElementById('res-time').textContent = document.getElementById('timer').textContent;
}
</script>
</body>
</html>
